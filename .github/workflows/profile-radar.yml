name: Update Profile Radar

on:
  schedule:
    - cron: "30 3 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "scripts/radar.py"
      - ".github/workflows/profile-radar.yml"

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate language radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/radar.py \
            --github "${{ github.repository_owner }}" \
            --out assets/radar-langs \
            --limit 7

      - name: Commit radar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/radar-langs-dark.svg
          git add assets/radar-langs-light.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile radar"
            git push
          fi
