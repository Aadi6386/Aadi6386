name: Contribution Calendar

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          user: Aadi6386
          template: classic
          filename: assets/metrics.isocalendar.svg

          base: header, activity, community, repositories, metadata

          config_timezone: Asia/Kolkata

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit generated calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/metrics.isocalendar.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update contribution calendar"
            git push
          fi
